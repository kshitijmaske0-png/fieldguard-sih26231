app = "fieldguard-sih26231"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FIELDGUARD_DATA_DIR = "/data"
  FIELDGUARD_DEMO_PASSWORD = "demo"

[[mounts]]
  source = "fieldguard_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
